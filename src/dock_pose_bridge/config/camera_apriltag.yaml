# 感知鏈參數：usb_cam（取像）＋ apriltag_ros（偵測）
#
# ✅ 套件已安裝（ros-humble-usb-cam 0.8.1 / ros-humble-image-proc 3.0.9 /
#    ros-humble-apriltag-ros 3.4.0），本檔的參數名已用 ros2 param list 核對。
#    整條鏈已用**真實相機＋真實 tag** 端到端驗過（見下方）。
#
# 相機硬體（已定案）：Waveshare OV9281 USB (A)，UVC、USB2.0、FOV 105°，
# 裝在**車尾朝後**（充電刷塊在車尾，倒車入位）。

# ---------------------------------------------------------------------------
# 取像：usb_cam
# ---------------------------------------------------------------------------
# 為什麼從 v4l2_camera 換成 usb_cam：這顆相機**只吐 MJPG**，
# `v4l2-ctl --list-formats-ext` 枚舉出來只有 Motion-JPEG 一種
# （1280x720 / 800x600 / 640x480，各 120 與 60 Hz）；而 v4l2_camera 只認
# YUYV / UYVY / GREY，完全對不上，開得起來也拿不到影像。usb_cam 有
# MJPEG 解碼路徑（libavcodec），且是 C++ 解碼，比臨時的 Python 橋接省 CPU。
#
# 🔴 為什麼不是 mono8（明明 apriltag 原生吃 mono8）：
# usb_cam 0.8.1 的 pixel_format 共 11 種
# （rgb8 / yuyv / yuyv2rgb / uyvy / uyvy2rgb / mono8 / mono16 / y102mono8 /
#  raw_mjpeg / mjpeg2rgb / m4202rgb，見 include/usb_cam/usb_cam.hpp 的
#  driver_supported_formats()），但選定的 format 必須通過
#  `set_pixel_format()` 的檢查：它的 V4L2 fourcc 得出現在裝置枚舉清單裡
#  （usb_cam.hpp:346 `fmt.v4l2_fmt.pixel_format == found_driver_format->v4l2()`）。
#    - mono8      → V4L2_PIX_FMT_GREY（formats/mono.hpp:49）→ 本機沒有，出局
#    - mono16     → V4L2_PIX_FMT_Y16                        → 沒有，出局
#    - y102mono8  → V4L2_PIX_FMT_Y10                        → 沒有，出局
#    - raw_mjpeg  → fourcc 對得上，但 requires_conversion=false，
#                   等於把 JPEG bytes 原封不動塞進 sensor_msgs/Image，
#                   下游 rectify/apriltag 會把壓縮位元組當像素讀，出局
#    - mjpeg2rgb  → fourcc 對得上，libavcodec 真解碼，輸出 rgb8 ✅
#  ⇒ **只有 mjpeg2rgb 可用**，代價是 apriltag 端多一次 rgb8→mono8
#    （cv_bridge toCvShare(msg,"mono8") 自動轉，不必額外節點）。
usb_cam:
  ros__parameters:
    # udev rule 固定的 symlink（/etc/udev/rules.d/99-dock-camera.rules：
    # idVendor 32e6 / idProduct 9251 / ATTR{index}==0 → SYMLINK dock_camera）。
    # 這顆相機會佔掉兩個 /dev/videoN，index=0 才是取像節點，用號碼會漂。
    video_device: /dev/dock_camera

    # MJPEG → libavcodec 解碼 → swscale 轉 rgb8。理由見上面那段。
    pixel_format: mjpeg2rgb

    # 送進 libavcodec 的來源像素格式。相機 JPEG 實測是 4:2:2
    # （PIL get_sampling() = 1），所以是 422P 而不是 420P。
    # 不用 AV_PIX_FMT_YUVJ422P：實測輸出的亮度統計與 YUV422P 完全相同
    # （min/max/mean/std 皆 63/255/171.9/71.3），但會多噴一行
    # 「deprecated pixel format used」；官方 params_1.yaml 也是用 YUV422P。
    av_device_format: AV_PIX_FMT_YUV422P

    image_width: 1280
    image_height: 720

    # 🔴 刻意壓低。裝置只枚舉 120/60 Hz 兩種 interval，但 usb_cam 的
    # framerate **不是**丟給 V4L2 S_PARM，而是節點自己的 timer 週期
    # （實測 log：「Timer triggering every 66 ms」＝1/15s），所以不受
    # 裝置 interval 清單限制，15 這種非枚舉值照樣生效
    # （實測 `ros2 topic hz /image_raw` 平均 14.0–15.1 Hz）。
    # 為什麼是 15 而不是 60/120：apriltag 是 CPU 大戶（前次量測 10fps 時
    # 就吃掉 34.6%），docking 又是低速動作，15fps 綽綽有餘。
    framerate: 15.0

    io_method: mmap
    camera_name: dock_camera

    # 🔴 這個 frame 名必須與 config/dock_pose_bridge.yaml 的
    # camera_optical_frame 一致：apriltag_ros 把 tag 的 TF 掛在影像的
    # header.frame_id 底下，bridge 就是照這個名字去查。
    frame_id: dock_camera_optical_frame

    # 🔴 目前是**幾何推算的佔位內參，不是標定結果**（標定另約）：
    # fx=fy=(1468.6/2)/tan(105°/2)≈563.4、cx/cy=影像中心、D 全 0。
    # 沒有內參就估不出位姿（apriltag_ros 只讀 P 矩陣的 fx/fy/cx/cy）。
    # 標定方式：
    #   ros2 run camera_calibration cameracalibrator \
    #     --size 8x6 --square 0.025 --no-service-check \
    #     --ros-args -r image:=/image_raw -r camera:=/camera
    # 產出的 yaml 覆蓋到下面這個路徑（usb_cam 走 camera_info_manager，
    # URL 一律顯式寫 file:///；檔案不存在只會 warn，然後發全零 camera_info，
    # 那會讓 apriltag 估不出位姿——所以這個檔必須存在）。
    camera_info_url: file:///home/robot0/.ros/camera_info/dock_camera.yaml

# ---------------------------------------------------------------------------
# 偵測：apriltag_ros（christianrauch 版）
# ---------------------------------------------------------------------------
# 輸入 image_rect + camera_info，輸出 /tf（child frame = "tag36h11:<id>"）。
# detections 訊息裡**沒有 pose 欄位**，位姿只能從 /tf 取——這就是
# dock_pose_bridge 存在的理由。§4.1
#
# ✅ 已驗：餵一張合成的 tag36h11 id0 影像（1280x720 mono8，tag 200px，
# camera_info 用 fx=fy=900 的理想針孔 P 矩陣），apriltag_node 偵測到
# id=0 / hamming=0 / decision_margin=238，發出的 TF
# dock_camera_optical_frame → tag36h11:0 距離 0.540 m，
# 與 fx*size/px = 900*0.120/200 = 0.540 完全吻合——這同時證明下面的
# size: 0.120 真的有被吃進去（用預設值會算出不同距離）。
#
# ✅ 也已用**真相機＋真 tag**（螢幕顯示 tag36h11 id0）跑過整條鏈：
# id=0 / hamming=0 / decision_margin 95～127，/detected_dock_pose 連續流動。
# ⚠️ 逐幀命中率只有 4~6 成（30 秒內 426 幀命中 180、391 幀命中 247），
# 所以 dock_pose_bridge 的 max_transform_age_sec 不能設太小，
# docking_server 的 initial_perception_timeout 也保持放寬。
# 這是拍螢幕的量測值（刷新率拍頻＋反光），實體列印的 tag 應該會更好。
apriltag:
  ros__parameters:
    image_transport: raw
    family: 36h11

    # 🔴 tag 邊長，單位公尺，指**黑框外緣**（不含白邊），不是列印總寬。
    # 已定案 120mm 黑框外緣 ＝ 列印總寬 150mm。
    # 依據：120mm tag 在 105° 鏡頭、0.7m staging 距離下成像約 84px，
    # 對偵測門檻仍有約 20% 裕度。§6.1 / §6.2
    # ⚠️ 列印後務必實測黑框外緣寬度再回填——印表機縮放會讓實際尺寸不等於
    # 設計值，而這個值直接線性影響估出來的距離。§6.1
    size: 0.120

    # 不接受任何位元糾錯：dock 認錯 tag 的代價是撞上去。
    max_hamming: 0

    # 固定 pnp。homography 內部做了 x/y 軸交換與 z 反向，換過去會讓
    # docking_server.yaml 的 external_detection_rotation_pitch/roll 失效。§4.3
    pose_estimation_method: "pnp"

    detector:
      threads: 2        # Jetson Orin NX 上留餘裕給其他節點
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25

    tag:
      # 單一 ID。多一個 ID 就多一個認錯的機會，dock 只有一座。
      ids: [0]
      # 與上面的 size 同值（逐 ID 覆寫），黑框外緣 120mm。
      sizes: [0.120]
      # 不設 frames：維持預設命名 "tag36h11:0"，與
      # config/dock_pose_bridge.yaml 的 tag_family + tag_id 對得起來。
      # 若這裡改設 frames，記得把 bridge 的 tag_frame 一起改成同一個字串。
