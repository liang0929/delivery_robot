hs_motor_controller:
  ros__parameters:
    # 串口設定
    serial_port: "/dev/motor"
    baudrate: 115200
    device_id: 127

    # 機器人參數
    wheel_separation: 0.27      # 輪距 (m) - 校正後
    wheel_radius: 0.065        # 輪半徑 (m)
    gear_ratio: 20.0           # 減速比 (馬達轉20圈=輪子轉1圈)
    max_linear_vel: 0.05       # 最大線速度 (m/s)
    max_angular_vel: 0.4       # 最大角速度 (rad/s)
    min_rpm: 100.0             # 最小馬達 RPM (根據 AGV-BLD-2S 手冊)
    max_rpm: 3000.0            # 最大馬達 RPM
    control_frequency: 50.0    # 控制頻率 (Hz)

# EKF 感測器融合配置
# 配置原理：
# - 只使用輪式里程計（無 IMU）
# - odom: 提供 x, y 位置、yaw 姿態、線速度和角速度
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true           # 發布 odom -> base_footprint TF
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 輪式里程計配置（無 IMU 模式）
    # 狀態向量: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom_raw
    odom0_config: [true,  true,  false,    # 使用 x, y 位置
                   false, false, true,     # 使用 yaw 姿態（無 IMU 時從里程計獲取）
                   true,  true,  false,    # 使用 vx, vy 線速度
                   false, false, true,     # 使用 vyaw 角速度
                   false, false, false]    # 不使用加速度
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU 配置（已禁用 - 未連接 IMU）
    # 如需啟用 IMU，取消下面的註釋
    # imu0: /imu/data
    # imu0_config: [false, false, false,
    #               true,  true,  true,
    #               false, false, false,
    #               true,  true,  true,
    #               true,  true,  true]
    # imu0_queue_size: 10
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true

