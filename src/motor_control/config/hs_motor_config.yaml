hs_motor_controller:
  ros__parameters:
    # 串口設定
    serial_port: "/dev/ttyUSB0"
    baudrate: 115200
    device_id: 127

    # 機器人參數
    wheel_separation: 0.381    # 輪距 (m)
    wheel_radius: 0.065        # 輪半徑 (m)
    max_linear_vel: 1.11       # 最大線速度 (m/s)
    max_angular_vel: 2.0       # 最大角速度 (rad/s)
    min_rpm: 100.0             # 最小 RPM
    max_rpm: 3000.0            # 最大 RPM
    control_frequency: 20.0    # 控制頻率 (Hz)

