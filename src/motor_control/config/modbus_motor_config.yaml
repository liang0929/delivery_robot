modbus_motor_controller:
  ros__parameters:
    # 串口設定
    serial_port: "/dev/ttyUSB0"
    baudrate: 115200
    slave_id: 1

    # 機器人參數
    wheel_separation: 0.27     # 輪距 (m) - 校正後
    wheel_radius: 0.065        # 輪半徑 (m)
    gear_ratio: 20.0           # 減速比 (馬達轉20圈=輪子轉1圈)
    max_linear_vel: 0.05       # 最大線速度 (m/s)
    max_angular_vel: 0.4       # 最大角速度 (rad/s)
    min_rpm: 60.0              # 最小馬達 RPM
    max_rpm: 3000.0            # 最大馬達 RPM
    control_frequency: 50.0    # 控制頻率 (Hz)

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    # 座標系框架
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 里程計輸入
    odom0: /odom_raw
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU 輸入
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
