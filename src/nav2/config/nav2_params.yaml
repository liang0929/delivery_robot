amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 30              # 降低: 60 → 30 (減少計算量)
    max_particles: 1000        # 降低: 2000 → 1000 (啟動更快)
    min_particles: 200         # 降低: 500 → 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    resample_interval: 1
    # Humble 需使用 plugin 名稱（舊寫法 "differential" 會 load 失敗）
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    scan_topic: /scan
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml 不指定，
    # 由 bt_navigator 使用內建預設（即原本硬編的兩個 XML），
    # 避免綁死 /opt/ros/humble 絕對路徑
    # 完整清單由系統實際安裝的 libnav2_*_bt_node.so 產生。
    # 清單不完整會導致 bt_navigator 載入內建行為樹時因
    # "Node not recognized" 失敗而無法 activate，其 action server
    # 便會拒絕所有導航目標——症狀是「送出目標立刻 STUCK」。
    plugin_lib_names:
    - nav2_assisted_teleop_action_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_back_up_action_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_compute_and_track_route_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_route_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_controller_selector_bt_node
    - nav2_distance_controller_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_get_pose_from_path_action_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_is_battery_charging_condition_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_planner_selector_bt_node
    - nav2_progress_checker_selector_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_single_trigger_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_smoother_selector_bt_node
    - nav2_speed_controller_bt_node
    - nav2_spin_action_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_wait_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0   # 降低: 20 → 10 Hz (機器人速度慢不需要高頻)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1   # 減小：0.5 → 0.1m，更快偵測卡住
      movement_time_allowance: 30.0   # 增加：10 → 30 秒，給更多時間嘗試

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20         # 放寬容差，減少終點搖擺
      yaw_goal_tolerance: 0.35        # 放寬到 ~20 度，避免持續旋轉對齊
      stateful: True
    
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.05
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      lookahead_dist: 0.3
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.5
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      # 0.035 = 馬達最低可實現輪速 (min_rpm 100 / gear 20 @ r=0.065)
      # 低於此值馬達層會 clamp 到 min_rpm，控制器模型需與實際一致
      min_approach_linear_velocity: 0.035
      use_approach_linear_velocity_scaling: true
      max_allowed_time_to_collision: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # 修正參數名：Humble 為 regulated_linear_scaling_*（舊名會被靜默忽略）
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.035
      use_rotate_to_heading: false       # 關閉終點旋轉對齊，減少搖擺
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

# 以下三個節點由 nav2_bringup/navigation_launch.py 啟動，
# 先前未配置導致全用預設值（velocity_smoother 預設上限 0.5 m/s，
# 與馬達 clamp 0.05 嚴重不符）。cmd_vel 實際路徑：
# controller -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 與 hs_motor_config.yaml 的 max_linear_vel/max_angular_vel 一致
    max_velocity: [0.05, 0.0, 0.4]
    min_velocity: [-0.05, 0.0, -0.4]
    # 線加減速與 RPP 的 max_linear_accel/decel 0.5 對齊
    max_accel: [0.5, 0.0, 3.2]
    max_decel: [-0.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 5.0  # 降低: 20 → 5 Hz (路徑規劃不需要頻繁)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0         # 降低: 10 → 5 Hz
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    # 0.26 rad/s 以上輪速才超過馬達 min_rpm 死區 (0.034 m/s / 半輪距 0.135m)
    min_rotational_vel: 0.26
    rotational_acc_lim: 3.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0      # 降低: 5 → 3 Hz
      publish_frequency: 1.0     # 降低: 2 → 1 Hz
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05           # 降低: 0.025 → 0.05m (減少 4 倍 cells)
      # 50cm x 50cm 方形機器人，用 footprint 代替 robot_radius
      # robot_radius: 0.35
      footprint: "[[-0.25, -0.25], [-0.25, 0.25], [0.25, 0.25], [0.25, -0.25]]"
      # 2D LiDAR 只需要 obstacle_layer，不需要 voxel_layer
      # keepout_filter 放在最後：先鋪障礙與膨脹，再疊上虛擬牆禁行區
      plugins: ["obstacle_layer", "inflation_layer", "keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 必須大於 footprint 內切半徑 0.25 (0.5x0.5 方形機身)，
        # 否則距障礙 0.20~0.25m 區間代價為 0，規劃路徑會擦撞機身角落
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 0.5      # 降低: 1 → 0.5 Hz
      publish_frequency: 0.5     # 降低: 1 → 0.5 Hz
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # 50cm x 50cm 方形機器人
      footprint: "[[-0.25, -0.25], [-0.25, 0.25], [0.25, 0.25], [0.25, -0.25]]"
      resolution: 0.05           # 降低: 0.025 → 0.05m
      track_unknown_space: true
      # 2D LiDAR 只需要 obstacle_layer，不需要 voxel_layer
      # keepout_filter 放在最後：先鋪靜態地圖與膨脹，再疊上虛擬牆禁行區
      plugins: ["static_layer", "obstacle_layer", "inflation_layer", "keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 必須大於 footprint 內切半徑 0.25 (0.5x0.5 方形機身)，
        # 否則距障礙 0.20~0.25m 區間代價為 0，規劃路徑會擦撞機身角落
        inflation_radius: 0.35
      always_send_full_costmap: True

# ========== Costmap Filters（虛擬牆 keepout） ==========
# Winstec API 的虛擬牆（線段）經 nav2/keepout.py 產生 <map>.keepout.pgm/.yaml，
# 由 filter_mask_server 發布成 OccupancyGrid，
# costmap_filter_info_server 發布對應的 CostmapFilterInfo，
# 兩者由 global/local costmap 內的 keepout_filter 訂閱。

# 發布 keepout mask 的 map_server 實例。
# yaml_filename 由 launch 參數 keepout_mask 覆寫（預設 <map 同目錄>/<map>.keepout.yaml）。
filter_mask_server:
  ros__parameters:
    use_sim_time: False
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: ""

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0                                  # 0 = keepout / preferred lanes filter
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0
